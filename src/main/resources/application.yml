spring:
  config:
    import:
    - "optional:classpath:database.properties"
    - "optional:classpath:security.properties"
  application:
    name: RatingSystem
  datasource:
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
#    host: smtp.gmail.com
#    port: 587
    username: ${mail.support-email}
    password: ${mail.app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: 192.168.99.100
      port: 6379

logging:
  level:
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG
    org.springframework.transaction.interceptor: TRACE

jwt:
  token:
    secret: ${jwt.secret}
#    expired: 60000
    expired: 3600000            # 1 hour
    refresh-expired: 86400000   # 1 day

verification:
  code:
    timeout: 24

---

spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  sql:
    init:
      mode: always
  data:
    redis:
      host: 192.168.99.100
      port: 6379